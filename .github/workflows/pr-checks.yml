name: Pull Request Checks

on:
  pull_request:
    types: [assigned, opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

env:
  GITHUB_TOKEN: ${{ github.token }}

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-title:
    name: Validate PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Run semantic-pull-request
        uses: amannn/action-semantic-pull-request@v6
        with:
          # Ensure the subject does not start with an uppercase letter
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.

  validate-version:
    if: ${{ github.base_ref == 'main' }}
    name: Validate version update
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Check app directory for changes
        id: changed_files
        uses: tj-actions/changed-files@v47
        with:
          files: app/**

      - name: Check if version is updated
        if: steps.changed_files.outputs.any_changed == 'true'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { execFileSync } from "node:child_process";
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("app/package.json", "utf8"));
          const lock = JSON.parse(readFileSync("app/package-lock.json", "utf8"));
          const previous = execFileSync("git", ["describe", "--tags", "--abbrev=0", `origin/${process.env.BASE_BRANCH}`], { encoding: "utf8" }).trim();
          assert.match(manifest.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$/);
          assert.equal(lock.version, manifest.version);
          assert.equal(lock.packages[""].version, manifest.version);
          assert.notEqual(manifest.version, previous, "Application changes must bump the release version");
          console.log(`Release version: ${previous} -> ${manifest.version}`);
          NODE

  validate-node-version:
    name: Validate Node.js version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          package-manager-cache: false

      - name: Ensure local, CI, and Workers build versions match
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const pinned = readFileSync(".tool-versions", "utf8").split(/\r?\n/).find(line => line.startsWith("nodejs ")).split(/\s+/)[1];
          assert.equal(process.versions.node, pinned);
          assert.equal(readFileSync("app/.node-version", "utf8").trim(), pinned);
          console.log(`Local, CI, and Workers Builds use Node ${pinned}`);
          NODE

  validate-build:
    name: Validate application build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and dry-run Worker deployment
        run: npm run build && npm run deploy -- --dry-run
